<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #ffccd5;
    overflow: hidden;
  }

  section {
    display: none;
    width: 100vw;
    height: 100vh;
    text-align: center;
    color: white;
  }

  /* ---------- INTRO SLIDES ---------- */
  #intro {
    display: flex;
    align-items: center;
    justify-content: center;
    background: black;
  }

  #intro img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: fade 1s infinite;
  }

  @keyframes fade {
    0% { opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---------- MESSAGE PAGE ---------- */
  #message {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px;
    background: linear-gradient(#ff4d6d, #ff8fab);
  }

  h1 {
    font-size: 3rem;
  }

  p {
    font-size: 1.4rem;
    max-width: 700px;
    margin: 20px auto;
  }

  .buttons {
    margin-top: 40px;
  }

  button {
    font-size: 1.2rem;
    padding: 15px 30px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    position: relative;
  }

  #yes {
    background: #fff;
    color: #ff4d6d;
  }

  #no {
    background: #ff1f4c;
    color: white;
    position: absolute;
  }

  /* ---------- CELEBRATION ---------- */
  #celebrate {
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: radial-gradient(circle, #ff4d6d, #c9184a);
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
  }
</style>
</head>

<body>

<!-- INTRO -->
<section id="intro">
  <img id="slide" src="">
</section>

<!-- MESSAGE -->
<section id="message">
  <h1>My Love 💕</h1>
  <p>
    These past 3 years with you have been the most beautiful chapter of my life.
